name: deploy-indexer

on:
  push:
    branches: ["main"]
    paths:
      - "indexer/**"
      - "scripts/deploy_indexer.sh"
      - ".github/workflows/deploy-indexer.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy indexer
        uses: ./.github/actions/deploy-service
        with:
          script: ./scripts/deploy_indexer.sh
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
