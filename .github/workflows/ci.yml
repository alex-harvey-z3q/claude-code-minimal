name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: make lint

  python-lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [api, ingest, indexer]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements-dev.txt

      - name: Install lint dependencies
        working-directory: ${{ matrix.component }}
        run: pip install -r requirements-dev.txt

      - name: Lint ${{ matrix.component }}
        working-directory: ${{ matrix.component }}
        run: make lint

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install test dependencies
        working-directory: api
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          DB_HOST: localhost
          DB_USER: user
          DB_PASSWORD: password
          EMBED_DIM: "1536"
        run: python -m unittest discover -s api/tests -p "test*.py"
