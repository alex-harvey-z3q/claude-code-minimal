name: deploy-ingest

on:
  push:
    branches: ["main"]
    paths:
      - "ingest/**"
      - "scripts/deploy_ingest.sh"
      - ".github/workflows/deploy-ingest.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy ingest
        uses: ./.github/actions/deploy-service
        with:
          script: ./scripts/deploy_ingest.sh
          aws-role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
